name: Build profile cards

# Everything the README shows under "GitHub" that could otherwise depend on a
# third-party service is generated here and published to the `output` branch.
# The public github-readme-stats and github-profile-trophy deployments are down
# (DEPLOYMENT_PAUSED / DEPLOYMENT_DISABLED), so nothing is read from them.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_cards.py "${{ github.repository_owner }}" dist

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#5E9C82&color_dots=#f0f0f0,#cfe6da,#9ecfb6,#5E9C82,#2f6b52
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E4A0B7&color_dots=#161b22,#2b3f36,#43705c,#7FB79B,#c9e6d6

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
